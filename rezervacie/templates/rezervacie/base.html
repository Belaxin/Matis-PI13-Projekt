<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Rezervačný systém{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'index' %}">📅 Rezervácie</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="{% url 'room_list' %}" class="btn btn-outline-light btn-sm">Miestnosti</a>
        <a href="{% url 'reservation_list' %}" class="btn btn-outline-light btn-sm">Rezervácie</a>
        <a href="{% url 'equipment_list' %}" class="btn btn-outline-light btn-sm">Vybavenie</a>
        <div class="vr opacity-50 mx-1" style="color: white;"></div>
        {% if user.is_authenticated %}
          <span class="text-white-50 small">👤 {{ user.username }}</span>
          <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Odhlásiť</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Prihlásiť</a>
        {% endif %}
      </div>
    </div>
  </nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

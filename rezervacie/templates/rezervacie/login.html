{% extends "rezervacie/base.html" %}
{% block title %}Prihlásenie{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-4 text-center">Prihlásenie</h4>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Používateľské meno</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label">Heslo</label>
            {{ form.password }}
          </div>
          {% if form.errors %}
            <p class="text-danger small">Nesprávne meno alebo heslo.</p>
          {% endif %}
          <button type="submit" class="btn btn-primary w-100">Prihlásiť</button>
        </form>
        <hr />
        <p class="text-center small mb-0">
          Nemáš účet? <a href="{% url 'register' %}">Zaregistruj sa</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

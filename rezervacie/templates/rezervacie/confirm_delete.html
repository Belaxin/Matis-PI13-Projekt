{% extends "rezervacie/base.html" %}
{% block title %}Potvrdiť odstránenie{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm text-center">
      <div class="card-body p-4">
        <div class="fs-1 mb-2">⚠️</div>
        <h5>Naozaj chceš odstrániť túto {{ type }}?</h5>
        <p class="text-muted">{{ object }}</p>
        <form method="post" class="d-flex justify-content-center gap-2 mt-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Áno, odstrániť</button>
          <a href="javascript:history.back()" class="btn btn-secondary">Zrušiť</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "rezervacie/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header fw-semibold">{{ title }}</div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary w-100">Uložiť</button>
          <a href="javascript:history.back()" class="btn btn-secondary w-100 mt-2">Zrušiť</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
